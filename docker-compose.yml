services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: clinic_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: clinic_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinic
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: clinic
      MYSQL_PASSWORD: clinic123
    ports:
      - "3307:3306"
    volumes:
      - clinic_mysql_data:/var/lib/mysql

volumes:
  clinic_mysql_data:
